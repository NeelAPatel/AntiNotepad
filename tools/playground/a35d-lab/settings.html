<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AntiNotepad Settings</title><link rel="stylesheet" href="core.css">
<style>
html,body{width:100%;height:100%;overflow:hidden}body{border:1px solid #ffffff25;border-radius:8px}.window{height:100%;display:grid;grid-template-rows:42px 1fr}.titlebar{display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 18px;font-size:12px;color:var(--muted)}.body{display:grid;grid-template-columns:214px 1fr;min-height:0}.rail-host{margin:var(--snap-2-nav-top) var(--snap-2-nav-side) var(--snap-2-nav-bottom);display:flex;flex-direction:column;gap:12px;transform:translateX(calc(var(--snap-1-nav-left) - 18px))}.find-wrap{position:relative}.find-wrap .lab-glyph{position:absolute;left:10px;top:8px;color:var(--muted)}#find{width:100%;height:32px;padding-left:36px;background:#0004}.rail{display:flex;flex-direction:column;gap:2px}.nav-item{width:100%;height:36px;display:flex;align-items:center;gap:12px;padding:0 12px 0 var(--snap-3-nav-item-left);border-radius:8px;text-align:left;color:var(--muted)}.nav-item[aria-selected=true]{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--ink);font-weight:600}.scroller{min-width:0;min-height:0;overflow:auto}.page{margin:2px var(--snap-4-page-right) 32px 16px;max-width:780px}.page.animate{animation:arrive 160ms cubic-bezier(0,0,0,1)}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.kit-row-description{white-space:pre-line}.kit-subrow .kit-palette-chips{margin-left:0}.kit-subrow:has(.kit-palette-chips)>span:empty{display:none}.kit-card .kit-row-icon:empty{visibility:hidden}.loading{color:var(--muted)}
</style></head><body class="lab-backdrop"><div class="window"><header class="titlebar" id="titlebar"><span>AntiNotepad Settings</span><button class="kit-plain kit-icon-button" id="close" aria-label="Close (Esc)">✕</button></header><div class="body"><aside class="rail-host" id="railHost"><div class="find-wrap"><span id="findIcon"></span><input id="find" class="fl-textbox" placeholder="Find a setting" aria-label="Find a setting"></div><nav id="rail" class="rail" aria-label="Settings pages"></nav></aside><main id="scroll" class="scroller fl-scroll"><div id="page" class="page"></div></main></div></div>
<script src="core.js"></script><script>LAB.settingsPages={};</script><script src="settings-a.js"></script><script src="settings-b.js"></script><script src="settings-c.js"></script>
<script>
(()=>{'use strict';
LAB.backdrop(document.body);
const pages=[['Theme',0xf2f5],['UI',0xf592],['Editor',0xf386],['Feel',0xec8d],['System',0xf359],['Shortcuts',0xf4b8],['Storage',0xf418],['About',0xf4a3]];
const rail=document.getElementById('rail'),find=document.getElementById('find'),scroll=document.getElementById('scroll'),host=document.getElementById('page');
const state={theme:'system',lightPalette:'paper',darkPalette:'ink',material:'acrylic',tint:'0.7',scale:'1',caretStyle:'bar',caretBlink:true,caretGlide:true,splitPalette:'same',chrome:'fade',fadeAfter:'1600',bars:'docked',showDelete:true,showNew:true,slotDots:'pill',edgeFade:true,menuAction:true,menuColors:false,dimPinned:true,accent:'default'};
let selected='Theme';const ctx={state,refresh:()=>render(false,true),setTheme:id=>{LAB.setTheme(id);if(parent!==window)parent.postMessage({lab:'theme',id},'*');},mark:LAB.mark};
LAB.mark(document.querySelector('.find-wrap'),1);LAB.mark(document.getElementById('railHost'),2);LAB.mark(host,4);LAB.mark(find,19);
document.getElementById('findIcon').replaceWith(LAB.glyph(0xf68f,16,'var(--muted)','fluent'));
function nav(){rail.replaceChildren();for(const [name,icon] of pages){const b=document.createElement('button');b.type='button';b.className='kit-plain nav-item';b.setAttribute('aria-selected',String(!find.value.trim()&&selected===name));b.append(LAB.glyph(icon,20,'currentColor','fluent'),document.createTextNode(name));LAB.mark(b,3);b.onclick=()=>{selected=name;find.value='';render(true);};rail.append(b);}}
function build(name){const root=document.createElement('div');const page=LAB.settingsPages[name];if(typeof page==='function')page(root,LAB.kit.settings,ctx);else{const p=document.createElement('p');p.className='loading';p.textContent='Loading…';root.append(p);}return root;}
function render(animate=false,keepScroll=false){document.body.style.setProperty('--lab-tint',state.material==='solid'?'100%':`${Math.max(.86,Number(state.tint))*100}%`);const offset=scroll.scrollTop;nav();host.replaceChildren();host.classList.toggle('animate',animate);const query=find.value.trim().toLowerCase();host.append(LAB.kit.settings.heading(query?'Results':selected));if(!query)host.append(build(selected));else{let any=false;for(const [name] of pages){if(typeof LAB.settingsPages[name]!=='function')continue;const built=build(name);const rows=[...built.querySelectorAll('.kit-row,.kit-subrow')].filter(row=>{const text=[...row.querySelectorAll('.kit-row-title,.kit-row-description')].map(x=>x.textContent).join(' ').toLowerCase();return text.includes(query);});if(rows.length){any=true;host.append(LAB.kit.settings.group(name),LAB.kit.settings.card(rows));}}if(!any){const p=document.createElement('p');p.style.color='var(--muted)';p.textContent=`No setting matches “${find.value.trim()}”.`;host.append(p);}}scroll.scrollTop=keepScroll?offset:0;}
window.addEventListener('message',e=>{if(e.data?.lab==='theme' && LAB.palettes[e.data.id]){const p=LAB.palettes[e.data.id];state[p.dark?'darkPalette':'lightPalette']=p.id;render(false,true);}});find.addEventListener('input',()=>render());document.getElementById('close').onclick=()=>{if(parent!==window)parent.postMessage({lab:'close-settings'},'*');else document.querySelector('.window').hidden=true;};window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement===find){find.value='';render();find.blur();}});render();
})();
</script></body></html>
