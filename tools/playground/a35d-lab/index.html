<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A35d spacing lab</title><link rel="stylesheet" href="core.css"><style>
html,body{min-height:100%;background:#111;color:#eee}.lab-switch{display:none}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#242424;border-bottom:1px solid #555}.toolbar h1{font-size:15px;margin:0 16px 0 0}.toolbar button[aria-pressed=true],.tabs button[aria-selected=true]{background:#80622f;color:white}.toolbar label{display:flex;align-items:center;gap:5px}.workspace{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:20px;padding:20px}.pane{flex:none}.pane h2{font-size:13px;font-weight:600;color:#bbb;margin:0 0 8px}.pane iframe{display:block;background:#1c1b19;border:0;border-radius:8px}.pad-frame{width:508px;height:670px}.settings-frame{width:900px;height:720px}.tabs{display:none}@media(max-width:1468px){.workspace{justify-content:flex-start}}

</style></head><body><header class="toolbar"><h1>A35d spacing lab</h1><button class="fl-button" id="before">Before</button><button class="fl-button" id="after">After</button><button class="fl-button" id="flip">Flip</button><label><input id="changes" type="checkbox">Show changes</label><label>Theme <select id="theme" class="fl-combo"></select></label><button class="fl-button" id="showSettings">Open Settings</button></header><nav class="tabs" aria-label="Lab windows"><button class="fl-button" id="padTab">Pad</button><button class="fl-button" id="settingsTab">Settings</button></nav><main class="workspace"><section class="pane active" id="padPane"><h2>Pad</h2><iframe scrolling="no" class="pad-frame" id="pad" title="AntiNotepad pad" src="pad.html"></iframe></section><section class="pane" id="settingsPane"><h2>Settings</h2><iframe scrolling="no" class="settings-frame" id="settings" title="AntiNotepad settings" src="settings.html"></iframe></section></main><script src="core.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),frames=[$('pad'),$('settings')];let mode='before',changes=false,theme='ink';
for(const p of Object.values(LAB.palettes)){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('theme').append(o);} $('theme').value=theme;
function broadcast(message){for(const frame of frames)frame.contentWindow.postMessage(message,'*');}
function sync(frame){frame.contentWindow.postMessage({lab:'mode',mode},'*');frame.contentWindow.postMessage({lab:'changes',on:changes},'*');frame.contentWindow.postMessage({lab:'theme',id:theme},'*');}
function setMode(value){mode=value;LAB.setMode(value);$('before').setAttribute('aria-pressed',String(value==='before'));$('after').setAttribute('aria-pressed',String(value==='after'));broadcast({lab:'mode',mode});}
function tab(name){for(const n of ['pad','settings']){$(n+'Pane').classList.toggle('active',n===name);$(n+'Tab').setAttribute('aria-selected',String(n===name));}}
$('before').onclick=()=>setMode('before');$('after').onclick=()=>setMode('after');$('flip').onclick=()=>setMode(mode==='before'?'after':'before');$('changes').onchange=e=>{changes=e.target.checked;broadcast({lab:'changes',on:changes});};$('theme').onchange=e=>{theme=e.target.value;LAB.setTheme(theme);broadcast({lab:'theme',id:theme});};$('padTab').onclick=()=>tab('pad');$('settingsTab').onclick=()=>tab('settings');$('showSettings').onclick=()=>{ $('settingsPane').hidden=false;tab('settings');};for(const frame of frames)frame.addEventListener('load',()=>{sync(frame);if(frame.id==='pad'){const doc=frame.contentDocument;const resize=()=>{const pad=doc.querySelector('.pad-window'),controls=doc.querySelector('.lab-controls');if(!pad||!controls)return;frame.style.width=Math.ceil(pad.getBoundingClientRect().width+48)+'px';frame.style.height=Math.ceil(Math.max(pad.getBoundingClientRect().bottom,controls.getBoundingClientRect().bottom)+24)+'px';};const observer=new ResizeObserver(resize);observer.observe(doc.querySelector('.pad-window'));observer.observe(doc.querySelector('.lab-controls'));resize();}});
window.addEventListener('message',e=>{if(!frames.some(f=>f.contentWindow===e.source)||!e.data)return;const d=e.data;if(d.lab==='open-settings'){$('settingsPane').hidden=false;tab('settings');}else if(d.lab==='close-settings'){$('settingsPane').hidden=true;tab('pad');}else if(d.lab==='theme'&&LAB.palettes[d.id]){theme=d.id;$('theme').value=theme;LAB.setTheme(theme);broadcast({lab:'theme',id:theme});}});setMode(mode);tab('pad');
})();
</script></body></html>
