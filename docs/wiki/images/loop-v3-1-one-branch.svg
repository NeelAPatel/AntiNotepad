        <g text-anchor="middle" fill="#1d2421" opacity=".8"><text x="140" y="160">card</text><text x="185" y="160">3.1a</text><text x="230" y="160">3.1b</text><text x="275" y="160">3.1c</text><text x="320" y="160">…</text><text x="365" y="160">3.1i</text><text x="410" y="160">close</text></g>
        <circle cx="490" cy="230" r="6" style="fill:#b4621a"/>
