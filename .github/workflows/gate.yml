name: gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.0
        with:
          dotnet-version: 10.0.x

      - name: Run gate
        run: pwsh -NoProfile -File tools/gate.ps1 -Ci

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-report
          path: .coord/reports/ci.gate.md
          if-no-files-found: warn
